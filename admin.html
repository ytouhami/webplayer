<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --bg-soft:#0D1117; --panel-strong:rgba(17,21,28,0.85);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EDF1F5; --text-dim:#8A93A3; --text-faint:#4B5563;
    --accent:#4FE3D3; --accent-dim:#2A8F86; --accent-contrast:#052220; --live:#FF5C5C;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --veil-a:rgba(255,255,255,0.03); --accent-ui:var(--accent); --focus-ring:rgba(79,227,211,0.16);
  }
  [data-theme="light"]{
    --bg:#EAECEF; --bg-soft:#E2E5E9; --panel-strong:rgba(255,255,255,0.95);
    --border:rgba(10,15,20,0.12); --border-strong:rgba(10,15,20,0.22);
    --text:#12161C; --text-dim:#454E5A; --text-faint:#727C89;
    --veil-a:rgba(10,15,20,0.03); --accent-ui:#127A70; --focus-ring:rgba(18,122,112,0.18);
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .topbar{ display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
  .back-link{ display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-dim); padding:0.4rem 0.6rem; border-radius:var(--radius-sm); }
  .back-link svg{ width:1rem; height:1rem; }
  .back-link:hover{ color:var(--accent-ui); background:var(--veil-a); }
  .topbar-divider{ width:1px; height:1.2rem; background:var(--border); }
  .topbar-title{ font-family:var(--font-display); font-weight:600; font-size:0.95rem; }
  .admin-brand{ display:flex; align-items:center; gap:0.5rem; font-family:var(--font-display); font-weight:700; font-size:0.95rem; color:var(--text); }
  .admin-brand svg{ width:1.1rem; height:1.1rem; color:var(--accent-ui); }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    width:2.3rem; height:2.3rem; border-radius:50%; background:var(--veil-a); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn svg{ width:1rem; height:1rem; }
  .icon-btn:hover{ color:var(--accent-ui); border-color:var(--accent-ui); }

  .content{ max-width:52rem; margin:0 auto; padding:2.25rem 2.25rem 6rem; }

  .panel{ background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.75rem; margin-bottom:1.75rem; }
  .panel-title{ font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin-bottom:0.25rem; }
  .panel-sub{ color:var(--text-dim); font-size:0.85rem; margin-bottom:1.5rem; }

  .field-label{ display:block; font-family:var(--font-mono); font-size:0.66rem; letter-spacing:0.1em; color:var(--text-faint); margin-bottom:0.5rem; }
  .text-input{
    width:100%; background:var(--veil-a); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:0.7rem 0.9rem; color:var(--text); font-size:0.88rem; outline:0; transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .text-input::placeholder{ color:var(--text-faint); }
  .text-input:focus{ border-color:var(--accent-ui); box-shadow:0 0 0 3px var(--focus-ring); }

  /* Host rows */
  .host-row{ display:flex; align-items:center; gap:0.75rem; padding:0.85rem; border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:0.75rem; }
  .host-fields{ flex:1; display:grid; grid-template-columns:1fr 2fr; gap:0.6rem; min-width:0; }
  .host-delete{
    width:2.1rem; height:2.1rem; border-radius:var(--radius-sm); background:none; border:1px solid var(--border);
    color:var(--text-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .host-delete:hover{ color:var(--live); border-color:var(--live); }
  .host-delete svg{ width:0.95rem; height:0.95rem; }

  .add-host-btn{
    display:flex; align-items:center; gap:0.5rem; padding:0.7rem 1.1rem; border:1px dashed var(--border-strong);
    border-radius:var(--radius-md); background:none; color:var(--text-dim); font-weight:600; font-size:0.85rem;
    cursor:pointer; width:100%; justify-content:center; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .add-host-btn:hover{ border-color:var(--accent-ui); color:var(--accent-ui); }
  .add-host-btn svg{ width:0.95rem; height:0.95rem; }
  .empty-hosts{ color:var(--text-faint); font-size:0.85rem; text-align:center; padding:1.5rem 0; }

  /* Branding */
  .branding-field{ margin-bottom:1.4rem; }

  .logo-row{ display:flex; align-items:center; gap:1rem; }
  .logo-preview{
    width:3.4rem; height:3.4rem; border-radius:var(--radius-md); background:var(--bg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
  }
  .logo-preview svg, .logo-preview img{ width:100%; height:100%; object-fit:cover; }
  .logo-actions{ display:flex; gap:0.6rem; }
  .ghost-btn-sm{
    padding:0.55rem 0.9rem; border:1px solid var(--border-strong); background:none; color:var(--text);
    border-radius:var(--radius-sm); font-weight:600; font-size:0.8rem; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .ghost-btn-sm:hover{ border-color:var(--accent-ui); color:var(--accent-ui); }

  .accent-row{ display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; }
  .swatch{ width:2rem; height:2rem; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0; }
  .swatch.active{ border-color:var(--text); }
  .color-input{ width:2.6rem; height:2.6rem; border-radius:50%; border:1px solid var(--border-strong); background:none; padding:0; cursor:pointer; overflow:hidden; }
  .color-input::-webkit-color-swatch-wrapper{ padding:0; }
  .color-input::-webkit-color-swatch{ border:0; border-radius:50%; }

  .save-bar{ display:flex; align-items:center; gap:1rem; }
  .save-btn{
    display:flex; align-items:center; gap:0.5rem; padding:0.8rem 1.4rem; background:var(--accent-ui); color:var(--accent-contrast);
    border:0; border-radius:var(--radius-md); font-family:var(--font-display); font-weight:600; font-size:0.9rem; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .save-btn:hover{ transform:translateY(-1px); }
  .save-btn svg{ width:0.9rem; height:0.9rem; }
  .save-status{ font-size:0.82rem; color:var(--accent-ui); opacity:0; transition:opacity 0.2s ease; }
  .save-status.show{ opacity:1; }
  .reset-link{ margin-left:auto; font-size:0.8rem; color:var(--text-faint); text-decoration:underline; cursor:pointer; background:none; border:0; }
  .reset-link:hover{ color:var(--live); }

  @media (max-width:700px){
    .content{ padding:1.5rem 1.25rem 4rem; }
    .host-fields{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header class="topbar">
  <span class="admin-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.4-1.5-2.6-2.2.7a7.7 7.7 0 0 0-2.6-1.5L14.5 3h-3l-.5 2.7a7.7 7.7 0 0 0-2.6 1.5l-2.2-.7-1.5 2.6L6.6 10.5a7.6 7.6 0 0 0 0 3L4.7 15l1.5 2.6 2.2-.7c.75.65 1.63 1.15 2.6 1.5L11.5 21h3l.5-2.6c.97-.35 1.85-.85 2.6-1.5l2.2.7 1.5-2.6-1.9-1.4Z"/></svg>
    Pulse Admin
  </span>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode"></button>
</header>

<div class="content">

  <div class="panel">
    <h2 class="panel-title">Hosts</h2>
    <p class="panel-sub">Add one or more hosts. The active one is used to fetch live channels and VOD.</p>
    <div id="hostList"></div>
    <button class="add-host-btn" id="addHostBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add Host
    </button>
  </div>

  <div class="panel">
    <h2 class="panel-title">Branding</h2>
    <p class="panel-sub">Customize how the app looks for everyone signed in.</p>

    <div class="branding-field">
      <span class="field-label">APP NAME</span>
      <input type="text" class="text-input" id="appNameInput" placeholder="Pulse" maxlength="24">
    </div>

    <div class="branding-field">
      <span class="field-label">LOGO</span>
      <div class="logo-row">
        <div class="logo-preview" id="logoPreview"></div>
        <div class="logo-actions">
          <button class="ghost-btn-sm" id="uploadLogoBtn">Upload</button>
          <button class="ghost-btn-sm" id="resetLogoBtn">Reset to default</button>
        </div>
        <input type="file" id="logoFileInput" accept="image/*" style="display:none">
      </div>
    </div>

    <div class="branding-field">
      <span class="field-label">ACCENT COLOR</span>
      <div class="accent-row" id="accentRow">
        <input type="color" class="color-input" id="colorInput" value="#4FE3D3">
      </div>
    </div>
  </div>

  <div class="save-bar">
    <button class="save-btn" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      Save Changes
    </button>
    <span class="save-status" id="saveStatus">Saved</span>
    <button class="reset-link" id="resetAllBtn">Reset everything</button>
  </div>

</div>

<script>
  var DEFAULT_LOGO_SVG = '<svg viewBox="0 0 64 64" fill="none"><rect x="1.5" y="1.5" width="61" height="61" rx="18" fill="#0C0F14" stroke="#4FE3D3" stroke-opacity="0.35" stroke-width="1.5"/><rect x="13" y="36" width="7" height="12" rx="3" fill="#4FE3D3"/><rect x="24" y="28" width="7" height="20" rx="3" fill="#4FE3D3"/><rect x="35" y="20" width="7" height="28" rx="3" fill="#4FE3D3"/><rect x="46" y="12" width="7" height="36" rx="3" fill="#4FE3D3"/></svg>';
  var SWATCHES = ['#4FE3D3', '#8B7CF6', '#FFB454', '#F76E9C', '#56B6F0'];
  var STORAGE_KEY = 'pulse-admin-settings';

  function loadSettings(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      appName: 'Pulse',
      logo: null,
      accent: '#4FE3D3',
      hosts: []
    };
  }

  var settings = loadSettings();
  var nextHostId = settings.hosts.reduce(function(max, h){ return Math.max(max, h.id); }, 0) + 1;
  var pendingLogo = settings.logo;

  // ---- Hosts ----
  function renderHosts(){
    var wrap = document.getElementById('hostList');
    wrap.innerHTML = '';
    if (settings.hosts.length === 0){
      wrap.innerHTML = '<p class="empty-hosts">No hosts yet. Add one below.</p>';
      return;
    }
    settings.hosts.forEach(function(host){
      var row = document.createElement('div');
      row.className = 'host-row';
      row.innerHTML =
        '<div class="host-fields">' +
          '<input type="text" class="text-input" placeholder="Name" value="' + escapeHtml(host.name) + '" data-field="name">' +
          '<input type="text" class="text-input" placeholder="M3U / Xtream URL" value="' + escapeHtml(host.url) + '" data-field="url">' +
        '</div>' +
        '<button class="host-delete" aria-label="Remove host"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';

      row.querySelector('[data-field="name"]').addEventListener('input', function(){ host.name = this.value; });
      row.querySelector('[data-field="url"]').addEventListener('input', function(){ host.url = this.value; });
      row.querySelector('.host-delete').addEventListener('click', function(){
        settings.hosts = settings.hosts.filter(function(h){ return h.id !== host.id; });
        renderHosts();
      });
      wrap.appendChild(row);
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  document.getElementById('addHostBtn').addEventListener('click', function(){
    var id = nextHostId++;
    settings.hosts.push({ id: id, name: '', url: '' });
    renderHosts();
  });

  renderHosts();

  // ---- Branding ----
  document.getElementById('appNameInput').value = settings.appName;

  function currentLogoHtml(size){
    return pendingLogo ? '<img src="' + pendingLogo + '" alt="Logo">' : DEFAULT_LOGO_SVG;
  }
  function refreshLogoPreviews(){
    document.getElementById('logoPreview').innerHTML = currentLogoHtml();
  }
  refreshLogoPreviews();

  document.getElementById('uploadLogoBtn').addEventListener('click', function(){ document.getElementById('logoFileInput').click(); });
  document.getElementById('logoFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){ pendingLogo = ev.target.result; refreshLogoPreviews(); };
    reader.readAsDataURL(file);
  });
  document.getElementById('resetLogoBtn').addEventListener('click', function(){ pendingLogo = null; refreshLogoPreviews(); });

  // Accent swatches
  var accentRow = document.getElementById('accentRow');
  var colorInput = document.getElementById('colorInput');
  var currentAccent = settings.accent;

  function renderSwatches(){
    var existing = accentRow.querySelectorAll('.swatch');
    existing.forEach(function(s){ s.remove(); });
    SWATCHES.forEach(function(hex){
      var sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'swatch' + (hex.toLowerCase() === currentAccent.toLowerCase() ? ' active' : '');
      sw.style.background = hex;
      sw.addEventListener('click', function(){ currentAccent = hex; colorInput.value = hex; renderSwatches(); });
      accentRow.insertBefore(sw, colorInput);
    });
  }
  colorInput.value = currentAccent;
  colorInput.addEventListener('input', function(){ currentAccent = this.value; renderSwatches(); });
  renderSwatches();

  // ---- Save / Reset ----
  document.getElementById('saveBtn').addEventListener('click', function(){
    settings.appName = document.getElementById('appNameInput').value.trim() || 'Pulse';
    settings.logo = pendingLogo;
    settings.accent = currentAccent;
    settings.hosts = settings.hosts.filter(function(h){ return h.name.trim() || h.url.trim(); });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    var status = document.getElementById('saveStatus');
    status.classList.add('show');
    setTimeout(function(){ status.classList.remove('show'); }, 1800);
  });

  document.getElementById('resetAllBtn').addEventListener('click', function(){
    localStorage.removeItem(STORAGE_KEY);
    settings = loadSettings();
    pendingLogo = settings.logo;
    nextHostId = settings.hosts.reduce(function(max, h){ return Math.max(max, h.id); }, 0) + 1;
    document.getElementById('appNameInput').value = settings.appName;
    currentAccent = settings.accent;
    colorInput.value = currentAccent;
    renderSwatches();
    renderHosts();
    refreshLogoPreviews();
  });

  // Theme toggle (shared with rest of app)
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'light' ? moon : sun;
      localStorage.setItem('pulse-theme', theme);
    }
    var saved = localStorage.getItem('pulse-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));
    btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
