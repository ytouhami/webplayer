<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Category</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --bg-soft:#0D1117; --panel-strong:rgba(17,21,28,0.85);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EDF1F5; --text-dim:#8A93A3; --text-faint:#4B5563;
    --accent:#4FE3D3; --accent-dim:#2A8F86; --accent-contrast:#052220;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --veil-a:rgba(255,255,255,0.03); --accent-ui:var(--accent); --focus-ring:rgba(79,227,211,0.16);
  }
  [data-theme="light"]{
    --bg:#EAECEF; --bg-soft:#E2E5E9; --panel-strong:rgba(255,255,255,0.95);
    --border:rgba(10,15,20,0.12); --border-strong:rgba(10,15,20,0.22);
    --text:#12161C; --text-dim:#454E5A; --text-faint:#727C89;
    --veil-a:rgba(10,15,20,0.03); --accent-ui:#127A70; --focus-ring:rgba(18,122,112,0.18);
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .topbar{ display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
  .back-link{ display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-dim); padding:0.4rem 0.6rem; border-radius:var(--radius-sm); }
  .back-link svg{ width:1rem; height:1rem; }
  .back-link:hover{ color:var(--accent-ui); background:var(--veil-a); }
  .topbar-divider{ width:1px; height:1.2rem; background:var(--border); }
  .topbar-title{ font-family:var(--font-display); font-weight:600; font-size:0.95rem; }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    width:2.3rem; height:2.3rem; border-radius:50%; background:var(--veil-a); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn svg{ width:1rem; height:1rem; }
  .icon-btn:hover{ color:var(--accent-ui); border-color:var(--accent-ui); }

  .content{ max-width:72rem; margin:0 auto; padding:2rem 2.25rem 3.5rem; }

  .page-head{ display:flex; align-items:center; gap:1rem; margin-bottom:1.75rem; }
  .head-icon{ width:3.2rem; height:3.2rem; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .head-icon svg{ width:1.4rem; height:1.4rem; }
  .page-head h1{ font-family:var(--font-display); font-weight:700; font-size:1.5rem; }
  .page-head p{ color:var(--text-dim); font-size:0.85rem; font-family:var(--font-mono); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.75rem; flex-wrap:wrap; }
  .search{
    display:flex; align-items:center; gap:0.6rem; width:100%; max-width:22rem; background:var(--veil-a); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:0.65rem 0.9rem; transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search:focus-within{ border-color:var(--accent-ui); box-shadow:0 0 0 3px var(--focus-ring); }
  .search svg{ width:1rem; height:1rem; color:var(--text-faint); flex-shrink:0; }
  .search input{ flex:1; background:none; border:0; outline:0; color:var(--text); font-size:0.88rem; }
  .search input::placeholder{ color:var(--text-faint); }
  .result-count{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.08em; color:var(--text-faint); white-space:nowrap; }

  .vod-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(9.5rem, 1fr)); gap:1.1rem; }
  .vod-card{ display:flex; flex-direction:column; gap:0.55rem; }
  .poster{
    position:relative; aspect-ratio:2/3; border-radius:var(--radius-md); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer;
  }
  .poster .play-hover{
    width:2.4rem; height:2.4rem; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.15s ease;
  }
  .poster:hover .play-hover{ opacity:1; }
  .poster .play-hover svg{ width:1rem; height:1rem; color:#fff; }
  .vod-card h3{ font-size:0.85rem; font-weight:600; }
  .vod-meta{ font-size:0.72rem; color:var(--text-faint); }

  .g1{ background:linear-gradient(135deg,#1c2b3a,#0c1116); }
  .g2{ background:linear-gradient(135deg,#2a1c3a,#12121a); }
  .g3{ background:linear-gradient(135deg,#123a34,#0b1416); }
  .g4{ background:linear-gradient(135deg,#3a2a1c,#14100b); }
  .g5{ background:linear-gradient(135deg,#1c3a2a,#0d1410); }
  .g6{ background:linear-gradient(135deg,#2a1c1c,#141010); }

  .load-more{ display:flex; justify-content:center; margin-top:2rem; }
  .load-more button{
    padding:0.7rem 1.4rem; border:1px solid var(--border-strong); background:var(--veil-a); color:var(--text);
    border-radius:var(--radius-md); font-weight:600; font-size:0.85rem; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .load-more button:hover{ border-color:var(--accent-ui); color:var(--accent-ui); }

  .no-results{ display:none; text-align:center; padding:3rem 1rem; color:var(--text-faint); font-size:0.9rem; }

  @media (max-width:640px){
    .content{ padding:1.5rem 1.25rem 2.5rem; }
    .search{ max-width:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="categories.html" class="back-link" id="backLink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Categories
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-title" id="topbarTitle">Category</span>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode"></button>
</header>

<div class="content">
  <div class="page-head">
    <div class="head-icon" id="headIcon"></div>
    <div>
      <h1 id="pageHeading">Category</h1>
      <p id="pageSub">0 titles</p>
    </div>
  </div>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search this category">
    </label>
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="vod-grid" id="vodGrid"></div>
  <p class="no-results" id="noResults">No titles match your search.</p>
  <div class="load-more" id="loadMoreWrap"><button id="loadMoreBtn">Load more</button></div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var TYPE = params.get('type') === 'series' ? 'series' : 'movies';
  var CATNAME = params.get('name') || 'Action';
  var UNIT = TYPE === 'series' ? 'series' : 'movies';
  var PAGE_SIZE = 18;
  var MAX_ITEMS = 48;

  var icons = {
    bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke-linejoin="round"/>',
    mask: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/><path d="M8 15.5c1.2-1.6 6.8-1.6 8 0"/>',
    smile: '<circle cx="12" cy="12" r="8.5"/><circle cx="9" cy="10" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="0.9" fill="currentColor" stroke="none"/><path d="M8 14c1.2 1.6 6.8 1.6 8 0"/>',
    planet: '<circle cx="12" cy="11" r="5"/><path d="M3 15c4-3 14-3 18 0"/>',
    eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>',
    ghost: '<path d="M12 4a6 6 0 0 0-6 6v9l2-1.5L10 19l2-1.5L14 19l2-1.5L18 19v-9a6 6 0 0 0-6-6Z"/><circle cx="9.5" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="11" r="1" fill="currentColor" stroke="none"/>',
    camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4Z"/><circle cx="12" cy="13.5" r="3.3"/>',
    heart: '<path d="M12 20.5S3.5 15 3.5 9a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2c0 6-8.5 11.5-8.5 11.5Z"/>',
    star: '<path d="M12 3l2.6 5.9L21 9.6l-4.7 4.2 1.3 6.4L12 17l-5.6 3.2 1.3-6.4L3 9.6l6.4-0.7Z" stroke-linejoin="round"/>',
    balloon: '<circle cx="12" cy="9" r="6"/><path d="M12 15v6"/>',
    badge: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6Z"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>'
  };

  var categories = [
    { name:'Action', icon:'bolt', g:'g1', movies:128, series:34 },
    { name:'Drama', icon:'mask', g:'g2', movies:96, series:52 },
    { name:'Comedy', icon:'smile', g:'g3', movies:74, series:41 },
    { name:'Sci-Fi & Fantasy', icon:'planet', g:'g4', movies:61, series:28 },
    { name:'Thriller', icon:'eye', g:'g5', movies:88, series:19 },
    { name:'Horror', icon:'ghost', g:'g6', movies:53, series:12 },
    { name:'Documentary', icon:'camera', g:'g1', movies:42, series:23 },
    { name:'Romance', icon:'heart', g:'g2', movies:67, series:31 },
    { name:'Animation', icon:'star', g:'g3', movies:39, series:27 },
    { name:'Kids & Family', icon:'balloon', g:'g4', movies:45, series:18 },
    { name:'Crime', icon:'badge', g:'g5', movies:58, series:22 },
    { name:'Adventure', icon:'compass', g:'g6', movies:71, series:15 }
  ];

  var cat = categories.filter(function(c){ return c.name === CATNAME; })[0] || categories[0];
  var count = TYPE === 'series' ? cat.series : cat.movies;
  var LABEL = TYPE === 'series' ? 'Series' : 'Movies';

  document.title = 'Pulse · ' + cat.name;
  document.getElementById('backLink').href = 'categories.html?type=' + TYPE;
  document.getElementById('topbarTitle').textContent = LABEL;
  document.getElementById('pageHeading').textContent = cat.name;
  document.getElementById('pageSub').textContent = count + ' ' + UNIT;
  document.getElementById('searchInput').placeholder = 'Search ' + cat.name.toLowerCase();
  document.getElementById('headIcon').className = 'head-icon ' + cat.g;
  document.getElementById('headIcon').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + icons[cat.icon] + '</svg>';

  // Deterministic title generator so a given category always looks the same
  function seedFromString(str){ var h = 0; for (var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
  function hashIndex(seed, i, salt, mod){
    var x = (seed ^ Math.imul(i + salt, 2654435761)) >>> 0;
    x = Math.imul(x ^ (x >>> 15), 2246822519);
    x = Math.imul(x ^ (x >>> 13), 3266489917);
    x = (x ^ (x >>> 16)) >>> 0;
    return x % mod;
  }
  var ADJ = ['Midnight','Silent','Crimson','Northern','Broken','Hidden','Electric','Velvet','Iron','Paper','Amber','Glass','Static','Silver','Neon','Faded','Golden','Distant','Quiet','Wild'];
  var NOUN = ['Run','Horizon','Signal','Harbor','Drive','Bloom','Echo','Road','Shadow','Orbit','Current','Frontier','Circuit','Reel','Verse','Tide','Field','Chapter','Line','Hour'];
  var seed = seedFromString(cat.name + TYPE);

  var totalItems = Math.min(count, MAX_ITEMS);
  var allItems = [];
  for (var i = 0; i < totalItems; i++){
    var a = ADJ[hashIndex(seed, i, 11, ADJ.length)];
    var n = NOUN[hashIndex(seed, i, 97, NOUN.length)];
    var year = 2019 + ((seed + i) % 6);
    var g = 'g' + (((i + seed) % 6) + 1);
    var item = { title:a + ' ' + n, year:year, g:g };
    if (TYPE === 'series'){ item.seasons = 1 + ((seed + i*5) % 6); }
    else { item.duration = 84 + ((seed + i*3) % 62); }
    allItems.push(item);
  }

  var grid = document.getElementById('vodGrid');
  var noResults = document.getElementById('noResults');
  var resultCount = document.getElementById('resultCount');
  var loadMoreWrap = document.getElementById('loadMoreWrap');
  var visibleCount = PAGE_SIZE;
  var currentFiltered = allItems;

  function metaFor(item){
    return TYPE === 'series'
      ? item.year + ' · ' + item.seasons + (item.seasons === 1 ? ' Season' : ' Seasons')
      : item.year + ' · ' + item.duration + ' min';
  }

  function renderGrid(){
    grid.innerHTML = '';
    var slice = currentFiltered.slice(0, visibleCount);
    slice.forEach(function(item){
      var div = document.createElement('div');
      div.className = 'vod-card';
      var posterInner = '<div class="play-hover"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg></div>';
      if (TYPE === 'series'){
        var href = 'series.html?title=' + encodeURIComponent(item.title) + '&genre=' + encodeURIComponent(cat.name) + '&year=' + item.year + '&seasons=' + item.seasons + '&g=' + item.g;
        div.innerHTML = '<a class="poster ' + item.g + '" href="' + href + '">' + posterInner + '</a>' +
          '<h3><a href="' + href + '">' + item.title + '</a></h3><span class="vod-meta">' + metaFor(item) + '</span>';
      } else {
        div.innerHTML = '<div class="poster ' + item.g + '">' + posterInner + '</div>' +
          '<h3>' + item.title + '</h3><span class="vod-meta">' + metaFor(item) + '</span>';
      }
      grid.appendChild(div);
    });
    noResults.style.display = currentFiltered.length === 0 ? 'block' : 'none';
    resultCount.textContent = currentFiltered.length + ' shown of ' + count;
    loadMoreWrap.style.display = visibleCount < currentFiltered.length ? 'flex' : 'none';
  }

  document.getElementById('searchInput').addEventListener('input', function(){
    var q = this.value.trim().toLowerCase();
    currentFiltered = q ? allItems.filter(function(it){ return it.title.toLowerCase().indexOf(q) !== -1; }) : allItems;
    visibleCount = PAGE_SIZE;
    renderGrid();
  });

  document.getElementById('loadMoreBtn').addEventListener('click', function(){
    visibleCount += PAGE_SIZE;
    renderGrid();
  });

  renderGrid();

  // Theme toggle (shared with rest of app)
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'light' ? moon : sun;
      localStorage.setItem('pulse-theme', theme);
    }
    var saved = localStorage.getItem('pulse-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));
    btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
