<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --bg-soft:#0D1117; --panel-strong:rgba(17,21,28,0.85);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EDF1F5; --text-dim:#8A93A3; --text-faint:#4B5563;
    --accent:#4FE3D3; --accent-dim:#2A8F86; --accent-contrast:#052220;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --veil-a:rgba(255,255,255,0.03); --accent-ui:var(--accent); --focus-ring:rgba(79,227,211,0.16);
  }
  [data-theme="light"]{
    --bg:#EAECEF; --bg-soft:#E2E5E9; --panel-strong:rgba(255,255,255,0.95);
    --border:rgba(10,15,20,0.12); --border-strong:rgba(10,15,20,0.22);
    --text:#12161C; --text-dim:#454E5A; --text-faint:#727C89;
    --veil-a:rgba(10,15,20,0.03); --accent-ui:#127A70; --focus-ring:rgba(18,122,112,0.18);
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .topbar{ display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); flex-shrink:0; }
  .back-link{ display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-dim); padding:0.4rem 0.6rem; border-radius:var(--radius-sm); }
  .back-link svg{ width:1rem; height:1rem; }
  .back-link:hover{ color:var(--accent-ui); background:var(--veil-a); }
  .topbar-divider{ width:1px; height:1.2rem; background:var(--border); }
  .topbar-title{ font-family:var(--font-display); font-weight:600; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    width:2.3rem; height:2.3rem; border-radius:50%; background:var(--veil-a); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn svg{ width:1rem; height:1rem; }
  .icon-btn:hover{ color:var(--accent-ui); border-color:var(--accent-ui); }

  .body-shell{ flex:1; display:grid; grid-template-columns:20rem 1fr; min-height:0; }

  /* ---------- SIDEBAR ---------- */
  .ep-sidebar{ border-right:1px solid var(--border); background:var(--bg-soft); display:flex; flex-direction:column; min-height:0; }
  .sidebar-head{ padding:1.1rem 1.1rem 0.8rem; flex-shrink:0; }
  .sidebar-head h2{ font-family:var(--font-display); font-weight:700; font-size:1rem; margin-bottom:0.15rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sidebar-head p{ font-family:var(--font-mono); font-size:0.7rem; color:var(--text-faint); }

  .season-tabs{ display:flex; gap:0.4rem; overflow-x:auto; padding:0 1.1rem 0.9rem; flex-shrink:0; }
  .season-tab{
    padding:0.4rem 0.85rem; border-radius:999px; border:1px solid var(--border); background:var(--veil-a);
    color:var(--text-dim); font-size:0.78rem; font-weight:600; cursor:pointer; white-space:nowrap;
    transition:border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .season-tab:hover{ color:var(--text); }
  .season-tab.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }

  .episode-list{ list-style:none; overflow-y:auto; padding:0 0.6rem 1rem; flex:1; min-height:0; }
  .episode-row{
    display:flex; align-items:center; gap:0.7rem; padding:0.6rem; border-radius:var(--radius-sm);
    border-left:2px solid transparent; cursor:pointer; transition:background 0.15s ease, border-color 0.15s ease;
  }
  .episode-row:hover{ background:var(--veil-a); }
  .episode-row.active{ background:var(--veil-a); border-left-color:var(--accent-ui); }
  .ep-num{ font-family:var(--font-mono); font-size:0.7rem; color:var(--text-faint); width:1.3rem; flex-shrink:0; text-align:center; }
  .ep-info{ flex:1; min-width:0; }
  .ep-info h4{ font-size:0.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep-info p{ font-size:0.72rem; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep-duration{ font-family:var(--font-mono); font-size:0.68rem; color:var(--text-faint); flex-shrink:0; }
  .ep-playing-icon{ width:0.9rem; height:0.9rem; color:var(--accent-ui); flex-shrink:0; }

  /* ---------- PLAYER ---------- */
  .player-main{ padding:1.5rem; display:flex; flex-direction:column; min-height:0; }
  .player-shell{
    position:relative; flex:1; min-height:0; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border);
    background:linear-gradient(150deg, var(--ch-a, #123a34), var(--ch-b, #0b1416));
    display:flex; align-items:center; justify-content:center; transition:background 0.3s ease;
  }
  .player-center{
    width:4.5rem; height:4.5rem; border-radius:50%; background:rgba(255,255,255,0.14); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; transition:transform 0.15s ease;
  }
  .player-center:hover{ transform:scale(1.06); }
  .player-center svg{ width:1.7rem; height:1.7rem; }

  .signal-eq{ position:absolute; display:flex; align-items:flex-end; gap:4px; height:2.4rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .player-shell.is-playing .signal-eq{ opacity:0.5; }
  .player-shell.is-playing .player-center{ opacity:0; pointer-events:none; }
  .signal-eq .bar{ width:4px; border-radius:2px; background:#fff; animation:eqPulse ease-in-out infinite; }
  @keyframes eqPulse{ 0%,100%{ transform:scaleY(0.25); } 50%{ transform:scaleY(1); } }

  .player-overlay-bottom{ position:absolute; left:0; right:0; bottom:0; padding:2.5rem 1.4rem 1.1rem; background:linear-gradient(0deg, rgba(0,0,0,0.55), transparent); }
  .now-title{ color:#fff; font-family:var(--font-display); font-weight:700; font-size:1.2rem; margin-bottom:0.15rem; }
  .now-cat{ color:rgba(255,255,255,0.75); font-size:0.82rem; margin-bottom:1rem; }
  .controls{ display:flex; align-items:center; gap:0.6rem; }
  .ctrl-btn{ width:2.1rem; height:2.1rem; border-radius:50%; background:rgba(255,255,255,0.12); border:0; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .ctrl-btn:hover{ background:rgba(255,255,255,0.2); }
  .ctrl-btn svg{ width:0.95rem; height:0.95rem; }
  .ctrl-spacer{ flex:1; }
  .next-ep-btn{ display:flex; align-items:center; gap:0.4rem; padding:0.5rem 0.9rem; border-radius:999px; background:rgba(255,255,255,0.12); border:0; color:#fff; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .next-ep-btn:hover{ background:rgba(255,255,255,0.2); }
  .next-ep-btn svg{ width:0.8rem; height:0.8rem; }

  @media (max-width:880px){
    .body-shell{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .ep-sidebar{ border-right:0; border-bottom:1px solid var(--border); max-height:16rem; }
    .player-main{ padding:1rem; }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="series.html" class="back-link" id="backLink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Back
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-title" id="topbarTitle">Series</span>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode"></button>
</header>

<div class="body-shell">
  <aside class="ep-sidebar">
    <div class="sidebar-head">
      <h2 id="seriesTitle">Series</h2>
      <p id="seriesMeta"></p>
    </div>
    <div class="season-tabs" id="seasonTabs"></div>
    <ul class="episode-list" id="episodeList"></ul>
  </aside>

  <main class="player-main">
    <div class="player-shell" id="playerShell">
      <div class="player-center" id="playToggle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
      </div>
      <div class="signal-eq" id="signalEq"></div>

      <div class="player-overlay-bottom">
        <h2 class="now-title" id="nowTitle">Episode</h2>
        <p class="now-cat" id="nowCat"></p>
        <div class="controls">
          <button class="ctrl-btn" id="ctrlPlay" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlMute" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          </button>
          <div class="ctrl-spacer"></div>
          <button class="next-ep-btn" id="nextEpBtn">
            Next Episode
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlFullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var title = params.get('title') || 'Untitled Series';
  var genre = params.get('genre') || 'Drama';
  var year = parseInt(params.get('year')) || 2023;
  var seasonsCount = Math.max(1, parseInt(params.get('seasons')) || 1);
  var gClass = params.get('g') || 'g1';
  var initialSeason = Math.max(1, parseInt(params.get('season')) || 1);
  var initialEpisode = Math.max(1, parseInt(params.get('episode')) || 1);

  var GRADIENTS = { g1:['#1c2b3a','#0c1116'], g2:['#2a1c3a','#12121a'], g3:['#123a34','#0b1416'], g4:['#3a2a1c','#14100b'], g5:['#1c3a2a','#0d1410'], g6:['#2a1c1c','#141010'] };
  var colors = GRADIENTS[gClass] || GRADIENTS.g1;

  document.title = 'Pulse · ' + title;
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('seriesTitle').textContent = title;
  document.getElementById('seriesMeta').textContent = year + ' \u00b7 ' + genre + ' \u00b7 ' + seasonsCount + (seasonsCount === 1 ? ' Season' : ' Seasons');
  document.getElementById('backLink').href = 'series.html?title=' + encodeURIComponent(title) + '&genre=' + encodeURIComponent(genre) + '&year=' + year + '&seasons=' + seasonsCount + '&g=' + gClass;

  var playerShell = document.getElementById('playerShell');
  playerShell.style.setProperty('--ch-a', colors[0]);
  playerShell.style.setProperty('--ch-b', colors[1]);

  function seedFromString(str){ var h = 0; for (var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
  function hashIndex(seed, i, salt, mod){
    var x = (seed ^ Math.imul(i + salt, 2654435761)) >>> 0;
    x = Math.imul(x ^ (x >>> 15), 2246822519);
    x = Math.imul(x ^ (x >>> 13), 3266489917);
    x = (x ^ (x >>> 16)) >>> 0;
    return x % mod;
  }
  var seed = seedFromString(title + genre);

  var episodesPerSeason = [];
  for (var s = 1; s <= seasonsCount; s++){ episodesPerSeason.push(6 + hashIndex(seed, s, 41, 5)); }

  var EP_TITLES = ['Fault Lines','New Rules','No Turning Back','The Long Way','What\'s Left','Crossing Over','Old Wounds','Breaking Point','Common Ground','Point of No Return','The Reveal','Aftermath','Loose Ends','Home Again','The Long Game','Trust Issues','Behind Closed Doors','What Remains','The Long Night','Full Circle'];
  var EP_BLURBS = ['Tensions rise as new information comes to light.','An unexpected visitor changes everything.','A decision from the past resurfaces.','The group splits over how to proceed.','A discovery forces a difficult choice.','Old wounds reopen at the worst time.','Nothing goes according to plan.','A secret finally comes out.','The lines between right and wrong blur.','Everyone has something to hide.'];

  function episodeData(season, ep){
    var epSeed = season * 100 + ep;
    return {
      title: EP_TITLES[hashIndex(seed, epSeed, 13, EP_TITLES.length)],
      blurb: EP_BLURBS[hashIndex(seed, epSeed, 29, EP_BLURBS.length)],
      duration: 38 + hashIndex(seed, epSeed, 5, 19)
    };
  }

  var selectedSeason = Math.min(initialSeason, seasonsCount);
  var selectedEpisode = Math.min(initialEpisode, episodesPerSeason[selectedSeason - 1]);

  function renderTabs(){
    var wrap = document.getElementById('seasonTabs');
    wrap.innerHTML = '';
    for (var s = 1; s <= seasonsCount; s++){
      var btn = document.createElement('button');
      btn.className = 'season-tab' + (s === selectedSeason ? ' active' : '');
      btn.textContent = 'S' + s;
      btn.addEventListener('click', function(sNum){ return function(){
        selectedSeason = sNum; selectedEpisode = 1; renderTabs(); renderEpisodes(); loadEpisode();
      }; }(s));
      wrap.appendChild(btn);
    }
  }

  function renderEpisodes(){
    var list = document.getElementById('episodeList');
    list.innerHTML = '';
    var epCount = episodesPerSeason[selectedSeason - 1];
    for (var e = 1; e <= epCount; e++){
      var data = episodeData(selectedSeason, e);
      var li = document.createElement('li');
      li.className = 'episode-row' + (e === selectedEpisode ? ' active' : '');
      li.innerHTML =
        '<span class="ep-num">' + (e === selectedEpisode ? '<svg class="ep-playing-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>' : e) + '</span>' +
        '<div class="ep-info"><h4>' + data.title + '</h4><p>' + data.blurb + '</p></div>' +
        '<span class="ep-duration">' + data.duration + ' min</span>';
      li.addEventListener('click', function(eNum){ return function(){ selectedEpisode = eNum; renderEpisodes(); loadEpisode(); }; }(e));
      list.appendChild(li);
    }
  }

  function loadEpisode(){
    var data = episodeData(selectedSeason, selectedEpisode);
    document.getElementById('nowTitle').textContent = data.title;
    document.getElementById('nowCat').textContent = 'S' + selectedSeason + ' E' + selectedEpisode + ' \u00b7 ' + title;
    setPlaying(true);
  }

  document.getElementById('nextEpBtn').addEventListener('click', function(){
    var epCount = episodesPerSeason[selectedSeason - 1];
    if (selectedEpisode < epCount){ selectedEpisode++; }
    else if (selectedSeason < seasonsCount){ selectedSeason++; selectedEpisode = 1; renderTabs(); }
    else { return; }
    renderEpisodes();
    loadEpisode();
  });

  renderTabs();
  renderEpisodes();
  loadEpisode();

  // Play / pause (visual only — no real stream attached)
  var isPlaying = false;
  function setPlaying(state){
    isPlaying = state;
    playerShell.classList.toggle('is-playing', isPlaying);
    var icon = isPlaying
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>';
    document.getElementById('ctrlPlay').innerHTML = icon;
  }
  document.getElementById('playToggle').addEventListener('click', function(){ setPlaying(true); });
  document.getElementById('ctrlPlay').addEventListener('click', function(){ setPlaying(!isPlaying); });

  var muted = false;
  document.getElementById('ctrlMute').addEventListener('click', function(){
    muted = !muted;
    this.innerHTML = muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
  });

  document.getElementById('ctrlFullscreen').addEventListener('click', function(){
    if (!document.fullscreenElement){ playerShell.requestFullscreen && playerShell.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  });

  (function(){
    var eq = document.getElementById('signalEq');
    for (var i=0;i<14;i++){
      var bar = document.createElement('span');
      bar.className = 'bar';
      bar.style.height = (Math.random()*1.4+0.8) + 'rem';
      bar.style.animationDuration = (Math.random()*0.7+0.5) + 's';
      bar.style.animationDelay = (Math.random()*-1.5) + 's';
      eq.appendChild(bar);
    }
  })();

  // Theme toggle (shared with rest of app)
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'light' ? moon : sun;
      localStorage.setItem('pulse-theme', theme);
    }
    var saved = localStorage.getItem('pulse-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));
    btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
