<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Live TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --bg-soft:#0D1117; --panel-strong:rgba(17,21,28,0.85);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EDF1F5; --text-dim:#8A93A3; --text-faint:#4B5563;
    --accent:#4FE3D3; --accent-dim:#2A8F86; --accent-contrast:#052220; --live:#FF5C5C;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --veil-a:rgba(255,255,255,0.03); --accent-ui:var(--accent); --focus-ring:rgba(79,227,211,0.16);
  }
  [data-theme="light"]{
    --bg:#EAECEF; --bg-soft:#E2E5E9; --panel-strong:rgba(255,255,255,0.95);
    --border:rgba(10,15,20,0.12); --border-strong:rgba(10,15,20,0.22);
    --text:#12161C; --text-dim:#454E5A; --text-faint:#727C89;
    --veil-a:rgba(10,15,20,0.03); --accent-ui:#127A70; --focus-ring:rgba(18,122,112,0.18);
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .topbar{ display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); flex-shrink:0; }
  .back-link{ display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-dim); padding:0.4rem 0.6rem; border-radius:var(--radius-sm); }
  .back-link svg{ width:1rem; height:1rem; }
  .back-link:hover{ color:var(--accent-ui); background:var(--veil-a); }
  .topbar-divider{ width:1px; height:1.2rem; background:var(--border); }
  .topbar-title{ font-family:var(--font-display); font-weight:600; font-size:0.95rem; }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    width:2.3rem; height:2.3rem; border-radius:50%; background:var(--veil-a); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn svg{ width:1rem; height:1rem; }
  .icon-btn:hover{ color:var(--accent-ui); border-color:var(--accent-ui); }

  .body-shell{ flex:1; display:grid; grid-template-columns:19rem 1fr; min-height:0; }

  /* ---------- SIDEBAR ---------- */
  .channel-sidebar{ border-right:1px solid var(--border); background:var(--bg-soft); display:flex; flex-direction:column; min-height:0; }
  .search{
    display:flex; align-items:center; gap:0.6rem; margin:1.1rem 1.1rem 0.75rem; background:var(--veil-a);
    border:1px solid var(--border); border-radius:var(--radius-md); padding:0.6rem 0.85rem; flex-shrink:0;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search:focus-within{ border-color:var(--accent-ui); box-shadow:0 0 0 3px var(--focus-ring); }
  .search svg{ width:0.95rem; height:0.95rem; color:var(--text-faint); flex-shrink:0; }
  .search input{ flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font-size:0.85rem; }
  .search input::placeholder{ color:var(--text-faint); }

  .list-count{ padding:0 1.1rem 0.6rem; font-family:var(--font-mono); font-size:0.65rem; letter-spacing:0.1em; color:var(--text-faint); flex-shrink:0; }

  .channel-list{ list-style:none; overflow-y:auto; padding:0 0.6rem 1rem; flex:1; min-height:0; }
  .channel-item{
    display:flex; align-items:center; gap:0.75rem; padding:0.6rem 0.6rem; border-radius:var(--radius-sm);
    border-left:2px solid transparent; cursor:pointer; transition:background 0.15s ease, border-color 0.15s ease;
  }
  .channel-item:hover{ background:var(--veil-a); }
  .channel-item.active{ background:var(--veil-a); border-left-color:var(--accent-ui); }
  .ch-badge{
    width:2.1rem; height:2.1rem; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:0.68rem; color:#fff;
  }
  .ch-info{ flex:1; min-width:0; }
  .ch-info h3{ font-size:0.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ch-meta{ font-family:var(--font-mono); font-size:0.62rem; color:var(--text-faint); }
  .ch-live{ width:6px; height:6px; border-radius:50%; background:var(--live); flex-shrink:0; }
  .no-results{ padding:1.5rem 1rem; text-align:center; color:var(--text-faint); font-size:0.82rem; display:none; }

  /* ---------- PLAYER ---------- */
  .player-main{ padding:1.5rem; display:flex; flex-direction:column; min-height:0; }
  .player-shell{
    position:relative; flex:1; min-height:0; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--border);
    background:linear-gradient(150deg, var(--ch-a, #123a34), var(--ch-b, #0b1416));
    display:flex; align-items:center; justify-content:center;
    transition:background 0.3s ease;
  }
  .player-center{
    width:4.5rem; height:4.5rem; border-radius:50%; background:rgba(255,255,255,0.14); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; color:#fff; cursor:pointer; transition:transform 0.15s ease;
  }
  .player-center:hover{ transform:scale(1.06); }
  .player-center svg{ width:1.7rem; height:1.7rem; }

  .signal-eq{ position:absolute; display:flex; align-items:flex-end; gap:4px; height:2.4rem; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .player-shell.is-playing .signal-eq{ opacity:0.5; }
  .player-shell.is-playing .player-center{ opacity:0; pointer-events:none; }
  .signal-eq .bar{ width:4px; border-radius:2px; background:#fff; animation:eqPulse ease-in-out infinite; }
  @keyframes eqPulse{ 0%,100%{ transform:scaleY(0.25); } 50%{ transform:scaleY(1); } }

  .player-overlay-top{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; background:linear-gradient(180deg, rgba(0,0,0,0.45), transparent); }
  .live-badge{ display:flex; align-items:center; gap:0.4rem; font-family:var(--font-mono); font-size:0.68rem; letter-spacing:0.1em; color:#fff; background:var(--live); padding:0.3rem 0.6rem; border-radius:5px; }
  .live-badge .dot{ width:6px; height:6px; border-radius:50%; background:#fff; }
  .ch-number-badge{ font-family:var(--font-mono); font-size:0.7rem; color:#fff; background:rgba(0,0,0,0.35); padding:0.3rem 0.6rem; border-radius:5px; }

  .player-overlay-bottom{ position:absolute; left:0; right:0; bottom:0; padding:2.5rem 1.25rem 1rem; background:linear-gradient(0deg, rgba(0,0,0,0.55), transparent); }
  .now-title{ color:#fff; font-family:var(--font-display); font-weight:700; font-size:1.15rem; margin-bottom:0.15rem; }
  .now-cat{ color:rgba(255,255,255,0.75); font-size:0.8rem; margin-bottom:0.9rem; }
  .controls{ display:flex; align-items:center; gap:0.6rem; }
  .ctrl-btn{ width:2.1rem; height:2.1rem; border-radius:50%; background:rgba(255,255,255,0.12); border:0; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .ctrl-btn:hover{ background:rgba(255,255,255,0.2); }
  .ctrl-btn svg{ width:0.95rem; height:0.95rem; }
  .ctrl-spacer{ flex:1; }

  @media (max-width:880px){
    .body-shell{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .channel-sidebar{ border-right:0; border-bottom:1px solid var(--border); max-height:14rem; }
    .player-main{ padding:1rem; }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="home.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    Home
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Live TV</span>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode"></button>
</header>

<div class="body-shell">
  <aside class="channel-sidebar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search channels">
    </label>
    <span class="list-count" id="listCount">8 CHANNELS</span>
    <ul class="channel-list" id="channelList"></ul>
    <p class="no-results" id="noResults">No channels match your search.</p>
  </aside>

  <main class="player-main">
    <div class="player-shell" id="playerShell">
      <div class="player-overlay-top">
        <span class="live-badge"><span class="dot"></span>LIVE</span>
        <span class="ch-number-badge" id="chNumberBadge">CH. 01</span>
      </div>

      <div class="player-center" id="playToggle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
      </div>
      <div class="signal-eq" id="signalEq"></div>

      <div class="player-overlay-bottom">
        <h2 class="now-title" id="nowTitle">News Circuit</h2>
        <p class="now-cat" id="nowCat">News</p>
        <div class="controls">
          <button class="ctrl-btn" id="ctrlPlay" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
          </button>
          <button class="ctrl-btn" id="ctrlMute" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
          </button>
          <div class="ctrl-spacer"></div>
          <button class="ctrl-btn" id="ctrlFullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  var channels = [
    { name:'News Circuit', num:'01', cat:'News', badge:'NC', a:'#4FE3D3', b:'#2A8F86' },
    { name:'Sports Arena', num:'04', cat:'Sports', badge:'SA', a:'#FF8A65', b:'#C4531F' },
    { name:'Wildlife Frontier', num:'07', cat:'Documentary', badge:'WF', a:'#8B7CF6', b:'#4C3FA8' },
    { name:'Cartoon Bay', num:'09', cat:'Kids', badge:'CB', a:'#FFD166', b:'#B8860B' },
    { name:'Music Current', num:'12', cat:'Music', badge:'MC', a:'#F76E9C', b:'#A83A63' },
    { name:'Cinema Reel', num:'15', cat:'Movies', badge:'CR', a:'#5AD1E6', b:'#1E7A8C' },
    { name:'Kids Orbit', num:'18', cat:'Kids', badge:'KO', a:'#9BE15D', b:'#4B8B2E' },
    { name:'Docu Now', num:'21', cat:'Documentary', badge:'DN', a:'#B0BEC5', b:'#546E7A' }
  ];

  var listEl = document.getElementById('channelList');
  var noResults = document.getElementById('noResults');
  var listCount = document.getElementById('listCount');
  var playerShell = document.getElementById('playerShell');
  var nowTitle = document.getElementById('nowTitle');
  var nowCat = document.getElementById('nowCat');
  var chNumberBadge = document.getElementById('chNumberBadge');
  var activeIndex = 0;

  function renderList(filter){
    listEl.innerHTML = '';
    var q = (filter || '').trim().toLowerCase();
    var shown = 0;
    channels.forEach(function(ch, i){
      if (q && ch.name.toLowerCase().indexOf(q) === -1) return;
      shown++;
      var li = document.createElement('li');
      li.className = 'channel-item' + (i === activeIndex ? ' active' : '');
      li.innerHTML =
        '<div class="ch-badge" style="background:linear-gradient(135deg,' + ch.a + ',' + ch.b + ')">' + ch.badge + '</div>' +
        '<div class="ch-info"><h3>' + ch.name + '</h3><span class="ch-meta">CH. ' + ch.num + '</span></div>' +
        '<span class="ch-live"></span>';
      li.addEventListener('click', function(){ selectChannel(i); });
      listEl.appendChild(li);
    });
    noResults.style.display = shown === 0 ? 'block' : 'none';
    listCount.textContent = shown + (shown === 1 ? ' CHANNEL' : ' CHANNELS');
  }

  function selectChannel(i){
    activeIndex = i;
    var ch = channels[i];
    nowTitle.textContent = ch.name;
    nowCat.textContent = ch.cat;
    chNumberBadge.textContent = 'CH. ' + ch.num;
    playerShell.style.setProperty('--ch-a', ch.a);
    playerShell.style.setProperty('--ch-b', ch.b);
    renderList(document.getElementById('searchInput').value);
  }

  document.getElementById('searchInput').addEventListener('input', function(){ renderList(this.value); });

  renderList('');
  selectChannel(0);

  // Play / pause (visual only — no real stream attached)
  var isPlaying = false;
  function setPlaying(state){
    isPlaying = state;
    playerShell.classList.toggle('is-playing', isPlaying);
    var icon = isPlaying
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>';
    document.getElementById('ctrlPlay').innerHTML = icon;
  }
  document.getElementById('playToggle').addEventListener('click', function(){ setPlaying(true); });
  document.getElementById('ctrlPlay').addEventListener('click', function(){ setPlaying(!isPlaying); });

  // Mute toggle (visual only)
  var muted = false;
  document.getElementById('ctrlMute').addEventListener('click', function(){
    muted = !muted;
    this.innerHTML = muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
  });

  // Fullscreen
  document.getElementById('ctrlFullscreen').addEventListener('click', function(){
    if (!document.fullscreenElement){ playerShell.requestFullscreen && playerShell.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  });

  // Build EQ bars once
  (function(){
    var eq = document.getElementById('signalEq');
    for (var i=0;i<14;i++){
      var bar = document.createElement('span');
      bar.className = 'bar';
      bar.style.height = (Math.random()*1.4+0.8) + 'rem';
      bar.style.animationDuration = (Math.random()*0.7+0.5) + 's';
      bar.style.animationDelay = (Math.random()*-1.5) + 's';
      eq.appendChild(bar);
    }
  })();

  // Theme toggle (shared with rest of app)
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'light' ? moon : sun;
      localStorage.setItem('pulse-theme', theme);
    }
    var saved = localStorage.getItem('pulse-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));
    btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
