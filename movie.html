<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse · Movie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12; --bg-soft:#0D1117; --panel-strong:rgba(17,21,28,0.85);
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EDF1F5; --text-dim:#8A93A3; --text-faint:#4B5563;
    --accent:#4FE3D3; --accent-dim:#2A8F86; --accent-contrast:#052220;
    --radius-lg:20px; --radius-md:14px; --radius-sm:9px;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
    --veil-a:rgba(255,255,255,0.03); --accent-ui:var(--accent); --focus-ring:rgba(79,227,211,0.16);
  }
  [data-theme="light"]{
    --bg:#EAECEF; --bg-soft:#E2E5E9; --panel-strong:rgba(255,255,255,0.95);
    --border:rgba(10,15,20,0.12); --border-strong:rgba(10,15,20,0.22);
    --text:#12161C; --text-dim:#454E5A; --text-faint:#727C89;
    --veil-a:rgba(10,15,20,0.03); --accent-ui:#127A70; --focus-ring:rgba(18,122,112,0.18);
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-contrast); }

  .topbar{ display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; border-bottom:1px solid var(--border); }
  .back-link{ display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; color:var(--text-dim); padding:0.4rem 0.6rem; border-radius:var(--radius-sm); flex-shrink:0; }
  .back-link svg{ width:1rem; height:1rem; }
  .back-link:hover{ color:var(--accent-ui); background:var(--veil-a); }
  .topbar-divider{ width:1px; height:1.2rem; background:var(--border); flex-shrink:0; }
  .topbar-title{ font-family:var(--font-display); font-weight:600; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-spacer{ flex:1; }
  .icon-btn{
    width:2.3rem; height:2.3rem; border-radius:50%; background:var(--veil-a); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; flex-shrink:0;
    transition:color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn svg{ width:1rem; height:1rem; }
  .icon-btn:hover{ color:var(--accent-ui); border-color:var(--accent-ui); }

  .content{ max-width:60rem; margin:0 auto; padding:2.25rem 2.25rem 3.5rem; }

  .detail-hero{ display:flex; gap:2rem; }
  .poster{
    position:relative; width:16rem; flex-shrink:0; aspect-ratio:2/3; border-radius:var(--radius-lg);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .poster svg{ width:2.6rem; height:2.6rem; color:rgba(255,255,255,0.5); }

  .g1{ background:linear-gradient(135deg,#1c2b3a,#0c1116); }
  .g2{ background:linear-gradient(135deg,#2a1c3a,#12121a); }
  .g3{ background:linear-gradient(135deg,#123a34,#0b1416); }
  .g4{ background:linear-gradient(135deg,#3a2a1c,#14100b); }
  .g5{ background:linear-gradient(135deg,#1c3a2a,#0d1410); }
  .g6{ background:linear-gradient(135deg,#2a1c1c,#141010); }

  .detail-info{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .eyebrow{ font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.12em; color:var(--accent-ui); margin-bottom:0.6rem; }
  .detail-info h1{ font-family:var(--font-display); font-weight:700; font-size:1.9rem; margin-bottom:0.7rem; line-height:1.15; }
  .meta-row{ display:flex; align-items:center; flex-wrap:wrap; gap:0.6rem; margin-bottom:1.1rem; }
  .meta-chip{ font-family:var(--font-mono); font-size:0.75rem; color:var(--text-dim); }
  .meta-dot{ color:var(--text-faint); }
  .rating-chip{ display:flex; align-items:center; gap:0.3rem; font-family:var(--font-mono); font-size:0.75rem; color:var(--text); background:var(--veil-a); border:1px solid var(--border); padding:0.2rem 0.55rem; border-radius:6px; }
  .rating-chip svg{ width:0.8rem; height:0.8rem; color:#FFD166; }

  .synopsis{ color:var(--text-dim); font-size:0.92rem; line-height:1.65; max-width:38rem; margin-bottom:1.5rem; }

  .actions{ display:flex; gap:0.75rem; }
  .play-btn{
    display:flex; align-items:center; gap:0.55rem; padding:0.8rem 1.4rem; background:var(--accent); color:var(--accent-contrast);
    border:0; border-radius:var(--radius-md); font-family:var(--font-display); font-weight:600; font-size:0.9rem; cursor:pointer;
    transition:transform 0.15s ease;
  }
  .play-btn:hover{ transform:translateY(-1px); }
  .play-btn svg{ width:0.9rem; height:0.9rem; }
  .play-btn.is-loading{ opacity:0.75; cursor:progress; pointer-events:none; }
  .ghost-btn{
    display:flex; align-items:center; gap:0.5rem; padding:0.8rem 1.2rem; border:1px solid var(--border-strong); color:var(--text);
    border-radius:var(--radius-md); font-weight:600; font-size:0.9rem; background:none; cursor:pointer;
    transition:border-color 0.15s ease, color 0.15s ease;
  }
  .ghost-btn:hover{ border-color:var(--accent-ui); color:var(--accent-ui); }
  .ghost-btn svg{ width:0.9rem; height:0.9rem; }

  @media (max-width:700px){
    .detail-hero{ flex-direction:column; }
    .poster{ width:10.5rem; }
    .content{ padding:1.5rem 1.25rem 2.5rem; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="categories.html?type=movies" class="back-link" id="backLink">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    <span id="backLabel">Movies</span>
  </a>
  <div class="topbar-divider"></div>
  <span class="topbar-title" id="topbarTitle">Movie</span>
  <div class="topbar-spacer"></div>
  <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode"></button>
</header>

<div class="content">
  <div class="detail-hero">
    <div class="poster" id="posterEl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5Z" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="detail-info">
      <span class="eyebrow">MOVIE</span>
      <h1 id="titleEl">Title</h1>
      <div class="meta-row" id="metaRow"></div>
      <p class="synopsis" id="synopsisEl"></p>
      <div class="actions">
        <button class="play-btn" id="playBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>
          <span id="playLabel">Play</span>
        </button>
        <button class="ghost-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          My List
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var title = params.get('title') || 'Untitled Movie';
  var genre = params.get('genre') || 'Drama';
  var year = parseInt(params.get('year')) || 2023;
  var duration = parseInt(params.get('duration')) || 104;
  var gClass = params.get('g') || 'g1';

  document.title = 'Pulse · ' + title;
  document.getElementById('backLink').href = 'category.html?type=movies&name=' + encodeURIComponent(genre);
  document.getElementById('backLabel').textContent = genre;
  document.getElementById('topbarTitle').textContent = title;
  document.getElementById('titleEl').textContent = title;
  document.getElementById('posterEl').classList.add(gClass);

  function seedFromString(str){ var h = 0; for (var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h; }
  function hashIndex(seed, i, salt, mod){
    var x = (seed ^ Math.imul(i + salt, 2654435761)) >>> 0;
    x = Math.imul(x ^ (x >>> 15), 2246822519);
    x = Math.imul(x ^ (x >>> 13), 3266489917);
    x = (x ^ (x >>> 16)) >>> 0;
    return x % mod;
  }
  var seed = seedFromString(title + genre);
  var rating = (6.5 + (hashIndex(seed, 0, 3, 30) / 10)).toFixed(1);
  var hours = Math.floor(duration / 60), mins = duration % 60;

  var metaRow = document.getElementById('metaRow');
  metaRow.innerHTML =
    '<span class="rating-chip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.6 5.9L21 9.6l-4.7 4.2 1.3 6.4L12 17l-5.6 3.2 1.3-6.4L3 9.6l6.4-0.7Z"/></svg>' + rating + '</span>' +
    '<span class="meta-chip">' + year + '</span><span class="meta-dot">&middot;</span>' +
    '<span class="meta-chip">' + genre + '</span><span class="meta-dot">&middot;</span>' +
    '<span class="meta-chip">' + hours + 'h ' + mins + 'm</span>';

  var synopses = [
    "When a shocking discovery unravels years of carefully kept secrets, an unlikely group of allies must decide how far they're willing to go to set things right.",
    "Set against a backdrop of shifting loyalties, one family's rise forces everyone around them to choose a side, even when every choice comes at a cost.",
    "A quiet town is turned upside down after a stranger arrives with answers to questions no one knew to ask.",
    "As the stakes climb higher, old rivalries resurface and a new alliance is tested before the night is over.",
    "Following a life-changing event, the lead must rebuild from nothing while outrunning a past that refuses to stay buried.",
    "Told across multiple perspectives, this story follows a tight-knit group as they navigate ambition, loyalty, and a truth they've been avoiding.",
    "What begins as a routine investigation spirals into something far bigger, pulling everyone involved deeper than they ever intended to go.",
    "Years after a falling-out no one talks about, old friends are forced back together, and not everyone is happy about it.",
    "Behind closed doors, a seemingly ordinary life hides a web of decisions that are about to catch up with everyone involved.",
    "As the world around them changes fast, a small group holds onto what matters most, even when it means breaking the rules to do it."
  ];
  document.getElementById('synopsisEl').textContent = synopses[hashIndex(seed, 0, 7, synopses.length)];

  // Play button mock
  document.getElementById('playBtn').addEventListener('click', function(){
    var btn = this;
    if (btn.classList.contains('is-loading')) return;
    var label = document.getElementById('playLabel');
    var prev = label.textContent;
    btn.classList.add('is-loading');
    label.textContent = 'Loading…';
    setTimeout(function(){ label.textContent = prev; btn.classList.remove('is-loading'); }, 1200);
  });

  // Theme toggle (shared with rest of app)
  (function(){
    var root = document.documentElement;
    var btn = document.getElementById('themeToggle');
    var sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
    var moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
    function setTheme(theme){
      root.setAttribute('data-theme', theme);
      btn.innerHTML = theme === 'light' ? moon : sun;
      localStorage.setItem('pulse-theme', theme);
    }
    var saved = localStorage.getItem('pulse-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    setTheme(saved || (prefersLight ? 'light' : 'dark'));
    btn.addEventListener('click', function(){
      setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });
  })();
</script>

</body>
</html>
